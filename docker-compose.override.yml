services:
  rabbit-mq:
    image: rabbitmq:3-management
    container_name: campus-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:15
    container_name: campus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: Chaitanya
      POSTGRES_PASSWORD: Chaitanya@123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Chaitanya -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  auth-service:
    build:
      dockerfile: Dockerfile            # your dev Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://Chaitanya:Chaitanya%40123@postgres:5432/authdb
      RABBITMQ_URL: amqp://guest:guest@rabbit-mq:5672
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    command: sh -c "pnpm prisma generate && pnpm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
  user-service:
    build:
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://Chaitanya:Chaitanya%40123@postgres:5432/userdb
      RABBITMQ_URL: amqp://guest:guest@rabbit-mq:5672
    volumes:
      - ./services/user-service:/app
      - /app/node_modules
    command: sh -c "pnpm prisma generate && pnpm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
        
volumes:
  postgres_data: